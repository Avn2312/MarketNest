services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      MESSAGE_QUEUE: ${MESSAGE_QUEUE:-rabbitmq}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://rabbitmq:5672}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "5000:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
        VITE_CURRENCY: ${VITE_CURRENCY:-INR}
    env_file:
      - path: ./frontend/.env
        required: false
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rabbitmq-data:
